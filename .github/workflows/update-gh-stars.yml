name: Update GitHub star count

# Refreshes the build-time star count embedded in docs/index.html so the
# landing page never has to call api.github.com from a visitor's browser
# (privacy: no third-country transfer of visitor IPs). See
# scripts/update-gh-stars.mjs and docs/datenschutz.html.

on:
  schedule:
    - cron: "0 6 * * 1" # Mondays 06:00 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - name: Refresh the count and commit it
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Der Zaehler ist abgeleiteter Inhalt, also wird er bei einem Rennen mit
          # main auf dem neuen Stand NEU ERZEUGT statt zusammengefuehrt: das Skript
          # ersetzt nur die [data-gh-stars]-Elemente, alles andere kommt vom frisch
          # geholten Stand. Ein `git pull --rebase` waere hier die falsche Kur - die
          # Release-Commits fassen dieselben Dateien an, der Rebase bleibt dann mit
          # einem Konflikt stehen und der Job endet im halben Zustand (nachgestellt
          # am 07.09., nachdem der Lauf an genau diesem Rennen gescheitert war).
          for versuch in 1 2 3; do
            git fetch --quiet origin "${GITHUB_REF_NAME}"
            git reset --quiet --hard FETCH_HEAD
            node scripts/update-gh-stars.mjs
            # BEIDE Dateien: update-gh-stars.mjs schreibt auch docs/install.html.
            # Nur index.html zu pruefen liess die zweite Datei stillschweigend alt
            # werden, denn ohne Aenderung an index.html endete der Job vorher hier.
            if [[ -z "$(git status --porcelain docs/index.html docs/install.html)" ]]; then
              echo "Sternzahl unveraendert"
              exit 0
            fi
            git add docs/index.html docs/install.html
            git commit --quiet -m "chore: refresh GitHub star count"
            if git push --quiet origin "HEAD:${GITHUB_REF_NAME}"; then
              exit 0
            fi
            echo "Push abgelehnt, main hat sich bewegt - Versuch ${versuch} von 3"
          done
          exit 1
